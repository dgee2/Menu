name: Coverage report

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Find the current pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          number=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --paginate |
            jq -sr --arg sha "$HEAD_SHA" --arg repo "$HEAD_REPOSITORY" \
              '[.[][] | select(.head.sha == $sha and .head.repo.full_name == $repo) | .number] | first // empty')
          if [ -n "$number" ]; then
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for coverage artifacts
        if: steps.pr.outputs.number != ''
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          for suite in backend-unit backend-integration frontend; do
            size=$(jq -r --arg name "coverage-$suite" \
              '[.artifacts[] | select(.name == $name) | .size_in_bytes] | first // 0' \
              "$RUNNER_TEMP/artifacts.json")
            if [ "$size" -gt 0 ] && [ "$size" -le 10000000 ]; then
              echo "$suite=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Download backend unit coverage
        if: steps.artifacts.outputs.backend-unit == 'true'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: coverage-backend-unit
          path: ${{ runner.temp }}/coverage/coverage-backend-unit
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download backend integration coverage
        if: steps.artifacts.outputs.backend-integration == 'true'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: coverage-backend-integration
          path: ${{ runner.temp }}/coverage/coverage-backend-integration
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download frontend coverage
        if: steps.artifacts.outputs.frontend == 'true'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: coverage-frontend
          path: ${{ runner.temp }}/coverage/coverage-frontend
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Build coverage comment
        if: steps.pr.outputs.number != ''
        id: summary
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 - "$RUNNER_TEMP/coverage" "$RUNNER_TEMP/coverage-comment.md" "$RUN_URL" <<'PY'
          """Build a PR coverage comment from reports produced by the Build workflow."""

          import json
          import math
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path


          def percentage(value: object, scale: int = 1) -> str:
              number = float(value) * scale
              if not math.isfinite(number) or not 0 <= number <= 100:
                  raise ValueError("Invalid coverage percentage")
              return f"{number:.1f}%"


          def cobertura_metrics(path: Path) -> tuple[str, str]:
              if path.stat().st_size > 20_000_000:
                  raise ValueError("Cobertura report is too large")
              document = path.read_bytes()
              if b"<!DOCTYPE" in document.upper() or b"<!ENTITY" in document.upper():
                  raise ValueError("XML declarations are not allowed in coverage reports")
              root = ET.fromstring(document)
              if root.tag != "coverage":
                  raise ValueError("Expected a Cobertura coverage document")
              return percentage(root.attrib["line-rate"], 100), percentage(
                  root.attrib["branch-rate"], 100
              )


          def vitest_metrics(path: Path) -> tuple[str, str]:
              if path.stat().st_size > 5_000_000:
                  raise ValueError("Vitest summary is too large")
              summary = json.loads(path.read_text(encoding="utf-8"))
              return percentage(summary["total"]["lines"]["pct"]), percentage(
                  summary["total"]["branches"]["pct"]
              )


          def main() -> None:
              artifact_dir = Path(sys.argv[1])
              output_path = Path(sys.argv[2])
              run_url = sys.argv[3]
              reports = (
                  (
                      "MenuApi.Tests",
                      artifact_dir / "coverage-backend-unit" / "MenuApi.Tests.cobertura.xml",
                      cobertura_metrics,
                  ),
                  (
                      "MenuDB.Tests",
                      artifact_dir / "coverage-backend-unit" / "MenuDB.Tests.cobertura.xml",
                      cobertura_metrics,
                  ),
                  (
                      "MenuApi.Integration.Tests",
                      artifact_dir
                      / "coverage-backend-integration"
                      / "MenuApi.Integration.Tests.cobertura.xml",
                      cobertura_metrics,
                  ),
                  (
                      "Frontend",
                      artifact_dir / "coverage-frontend" / "coverage-summary.json",
                      vitest_metrics,
                  ),
              )

              rows = []
              for label, path, read_metrics in reports:
                  if not path.is_file():
                      continue
                  try:
                      lines, branches = read_metrics(path)
                  except (ET.ParseError, KeyError, OSError, TypeError, ValueError) as error:
                      print(f"Skipping invalid {label} coverage report: {error}", file=sys.stderr)
                      continue
                  rows.append(f"| {label} | {lines} | {branches} |")

              content = (
                  ["| Suite | Lines | Branches |", "| --- | ---: | ---: |", *rows]
                  if rows
                  else [
                      "No coverage report was produced for this run. "
                      "Tests may have been skipped or stopped early."
                  ]
              )
              comment = "\n".join(
                  [
                      "<!-- menu-ci-coverage -->",
                      "### Test coverage",
                      "",
                      *content,
                      "",
                      f"[View the test run]({run_url})",
                      "",
                  ]
              )
              output_path.write_text(comment, encoding="utf-8")


          if __name__ == "__main__":
              main()
          PY
          if [ -s "$RUNNER_TEMP/coverage-comment.md" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Comment coverage on pull request
        if: steps.summary.outputs.available == 'true'
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3
        continue-on-error: true
        with:
          issue: ${{ steps.pr.outputs.number }}
          message-id: menu-ci-coverage
          message-path: ${{ runner.temp }}/coverage-comment.md
