# Aspire's WithPnpm() spawns pnpm non-interactively with no TTY. Without this,
# any pnpm major-version change between the pnpm on your PATH and the store on
# disk (e.g. after upgrading your global pnpm) leaves a stale node_modules from
# the old version, and pnpm aborts waiting for a purge confirmation prompt it
# can never receive (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
confirmModulesPurge: false
allowBuilds:
  '@parcel/watcher': true
  browser-tabs-lock: true
  esbuild: true
  msw: true
  vue-demi: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - electron
  - esbuild
  - msw
  - vue-demi
overrides:
  # @auth0/auth0-vue declares vue as a regular dependency (not a peer), so pnpm
  # resolves it independently and installs a second vue copy whenever the range
  # it pins doesn't happen to match our own vue version exactly. Two vue
  # installs means two structurally-incompatible `App`/`Plugin` types, which
  # breaks `app.use(createAuth0())` under vue-tsc. Force a single instance.
  vue: ^3.5.41
