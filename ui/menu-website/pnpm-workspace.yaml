# Aspire's WithPnpm() spawns pnpm non-interactively with no TTY. Without this,
# a pnpm major-version bump (see the corepack packageManager pin in package.json)
# leaves a stale node_modules store from the old version, and pnpm aborts waiting
# for a purge confirmation prompt it can never receive
# (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
confirmModulesPurge: false
allowBuilds:
  '@parcel/watcher': true
  browser-tabs-lock: true
  esbuild: true
  msw: true
  vue-demi: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - electron
  - esbuild
  - msw
  - vue-demi
overrides:
  # @auth0/auth0-vue declares vue as a regular dependency (not a peer), so pnpm
  # resolves it independently and installs a second vue copy whenever the range
  # it pins doesn't happen to match our own vue version exactly. Two vue
  # installs means two structurally-incompatible `App`/`Plugin` types, which
  # breaks `app.use(createAuth0())` under vue-tsc. Force a single instance.
  vue: ^3.5.41
  # @vitest/mocker (pulled in by @storybook/addon-vitest's browser mode) only
  # peer-requires msw ^2.4.9, but pnpm's dedup picks the newest version that
  # satisfies every range in the graph — which silently pulled in msw 2.15.x
  # even though our own package.json still asks for ^2.12.14. msw 2.15's
  # `setupWorker()` no longer exposes `worker.context`, which
  # msw-storybook-addon@2.0.6 depends on, breaking every Storybook
  # interaction test with "Cannot set properties of undefined (setting
  # 'activationPromise')". Pin msw to the version msw-storybook-addon@2.0.6
  # was actually built against until the addon is upgraded to v3 (which
  # supports newer msw), so it stops floating up on unrelated bumps.
  msw: 2.12.14
